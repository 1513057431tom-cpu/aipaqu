[project]
name = "aipaqu-backend"
version = "0.1.0"
description = "FastAPI backend for the intelligent intelligence and periodic report platform."
requires-python = ">=3.10"
dependencies = [
  "alembic>=1.13,<2.0",
  "cryptography>=42,<47",
  "fastapi>=0.111,<1.0",
  "langchain>=1.0,<2.0",
  "langchain-deepseek>=1.0,<2.0",
  "langgraph>=1.0,<2.0",
  "pydantic-settings>=2.3,<3.0",
  "pymysql>=1.1,<2.0",
  "python-multipart>=0.0.6,<1.0",
  "python-docx>=1.1,<2.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
browser = [
  "cloakbrowser>=0.5,<1.0",
]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.2,<9.0",
  "ruff>=0.5,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["migrations*", "tests*"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"
